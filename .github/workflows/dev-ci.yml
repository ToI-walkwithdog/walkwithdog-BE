name: CI
run-name: CI
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: dev-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Dev quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.16
        env:
          POSTGRES_USER: toi_ci
          POSTGRES_PASSWORD: toi_ci_ephemeral
        options: >-
          --health-cmd "pg_isready -U toi_ci -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432
    env:
      DATABASE_URL: sqlite://
      PYTHONUTF8: '1'
      PGHOST: 127.0.0.1
      PGUSER: toi_ci
      PGPASSWORD: toi_ci_ephemeral
      PGOPTIONS: '-c log_min_error_statement=panic'
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/requirements-ci.txt
      - name: Install project and test dependencies
        run: python -m pip install -r requirements.txt -r .github/requirements-ci.txt
      - name: Check paths, syntax, and migration inventory
        run: |
          python -m compileall -q app scripts tests
          mkdir -p "$RUNNER_TEMP/trusted"
          if git cat-file -e "$BASE_SHA:docs/dev-automation/test-baseline.json" 2>/dev/null; then
            for path in scripts/dev_gate.py scripts/dev_test_report.py docs/dev-automation/test-baseline.json; do
              git show "$BASE_SHA:$path" > "$RUNNER_TEMP/trusted/$(basename "$path")"
            done
          else
            # First installation is a manually reviewed PR.
            cp scripts/dev_gate.py scripts/dev_test_report.py "$RUNNER_TEMP/trusted/"
            python -c 'import json, os; from scripts.dev_gate import parse_scope; assert parse_scope(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["pull_request"]["body"])[0] is None'
          fi
          python "$RUNNER_TEMP/trusted/dev_gate.py" scope "$GITHUB_EVENT_PATH"
          python scripts/check_migrations.py --check-reservations
          python -m unittest discover -s tests -p 'test_dev_delivery.py'
      - name: Configure disposable PostgreSQL connections
        env:
          SERVICE_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          [[ "$SERVICE_PORT" =~ ^[0-9]+$ ]]
          {
            printf 'PGPORT=%s\n' "$SERVICE_PORT"
            printf 'SIGNUP_TEST_DATABASE_URL=postgresql+psycopg2://toi_ci:toi_ci_ephemeral@127.0.0.1:%s/toi_walk_test_ci_signup\n' "$SERVICE_PORT"
            printf 'REGION_TEST_DATABASE_URL=postgresql+psycopg2://toi_ci:toi_ci_ephemeral@127.0.0.1:%s/toi_walk_test_ci_regions\n' "$SERVICE_PORT"
          } >> "$GITHUB_ENV"
      - name: Run complete suite against disposable PostgreSQL
        id: pytest
        shell: bash
        run: |
          python - <<'PY'
          from contextlib import closing
          import psycopg2
          with closing(psycopg2.connect(dbname="postgres")) as connection:
              connection.autocommit = True
              with connection.cursor() as cursor:
                  cursor.execute("CREATE DATABASE toi_walk_test_ci_signup")
                  cursor.execute("CREATE DATABASE toi_walk_test_ci_regions")
          PY
          PYTHONPATH="$GITHUB_WORKSPACE" python "$RUNNER_TEMP/trusted/dev_test_report.py" --out "$RUNNER_TEMP/report.json"
          if [[ -f "$RUNNER_TEMP/trusted/test-baseline.json" ]]; then
            baseline=(--base "$RUNNER_TEMP/trusted/test-baseline.json")
          else
            base_tree="$RUNNER_TEMP/dev-source"
            mkdir "$base_tree"
            git archive "$BASE_SHA" | tar -x -C "$base_tree"
            (cd "$base_tree" && PYTHONPATH="$base_tree" python "$RUNNER_TEMP/trusted/dev_test_report.py" \
              --collect-only --out "$RUNNER_TEMP/dev-collection.json")
            baseline=(--bootstrap-collection "$RUNNER_TEMP/dev-collection.json")
          fi
          python "$RUNNER_TEMP/trusted/dev_gate.py" tests "$RUNNER_TEMP/report.json" \
            "${baseline[@]}" --event "$GITHUB_EVENT_PATH"
      - name: Verify test-schema cleanup
        if: ${{ always() && steps.pytest.outcome != 'skipped' }}
        run: |
          python - <<'PY'
          from contextlib import closing
          import psycopg2
          for name in ("toi_walk_test_ci_signup", "toi_walk_test_ci_regions"):
              with closing(psycopg2.connect(dbname=name)) as connection, connection.cursor() as cursor:
                  cursor.execute("""
                      SELECT count(*) FROM pg_namespace
                      WHERE nspname <> 'public' AND nspname <> 'information_schema'
                        AND nspname NOT LIKE 'pg_%'
                  """)
                  assert cursor.fetchone() == (0,)
                  cursor.execute("SELECT count(*) FROM pg_tables WHERE schemaname = 'public'")
                  assert cursor.fetchone() == (0,)
          PY
